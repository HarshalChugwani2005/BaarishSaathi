AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BaarishSaathi Serverless Stack

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.11
    Architectures:
      - x86_64

Resources:
  # HTTP API with CORS and Throttling
  BaarishApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 100
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - "*"
          
  # DynamoDB Tables
  FloodSpotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FloodSpots
      AttributeDefinitions:
        - AttributeName: spotId
          AttributeType: S
      KeySchema:
        - AttributeName: spotId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Subscribers
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  FloodReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FloodReports
      AttributeDefinitions:
        - AttributeName: spotId
          AttributeType: S
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: reporterHash
          AttributeType: S
      KeySchema:
        - AttributeName: spotId
          KeyType: HASH
        - AttributeName: reportId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ReporterIndex
          KeySchema:
            - AttributeName: reporterHash
              KeyType: HASH
            - AttributeName: reportId
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      BillingMode: PAY_PER_REQUEST

  ReportPhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "baarish-saathi-photos-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldPhotos
            Status: Enabled
            ExpirationInDays: 2
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  # SNS Topic
  BaarishAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: BaarishAlerts

  BaarishSharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: baarish-shared-layer
      Description: Shared risk engine and Bedrock logic
      ContentUri: backend/shared_layer/
      CompatibleRuntimes:
        - python3.11

  # Lambda Functions
  SpotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/spots/
      Handler: app.lambda_handler
      Events:
        GetSpots:
          Type: HttpApi
          Properties:
            ApiId: !Ref BaarishApi
            Path: /spots
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FloodSpotsTable

  RiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/get_risk/
      Handler: app.lambda_handler
      Layers:
        - !Ref BaarishSharedLayer
      Events:
        GetRisk:
          Type: HttpApi
          Properties:
            ApiId: !Ref BaarishApi
            Path: /risk
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FloodSpotsTable
        - DynamoDBReadPolicy:
            TableName: !Ref FloodReportsTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "*"

  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/subscribe/
      Handler: app.lambda_handler
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref BaarishAlertsTopic
      Events:
        PostSubscribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref BaarishApi
            Path: /subscribe
            Method: POST
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref SubscribersTable
        - Statement:
            - Effect: Allow
              Action: 
                - sns:Subscribe
                - sns:ListSubscriptionsByTopic
                - sns:GetSubscriptionAttributes
                - sns:SetSubscriptionAttributes
              Resource: !Ref BaarishAlertsTopic

  ScheduledCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/scheduled_check/
      Handler: app.lambda_handler
      Layers:
        - !Ref BaarishSharedLayer
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref BaarishAlertsTopic
      Events:
        HourlyCheck:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FloodSpotsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubscribersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FloodReportsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt BaarishAlertsTopic.TopicName

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/reports/
      Handler: app.lambda_handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          REPORTS_TABLE: !Ref FloodReportsTable
          PHOTOS_BUCKET: !Ref ReportPhotosBucket
          SALT: "hackathon-secret-salt"
      Events:
        GetReports:
          Type: HttpApi
          Properties:
            ApiId: !Ref BaarishApi
            Path: /reports
            Method: GET
        PostReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref BaarishApi
            Path: /reports
            Method: POST
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref BaarishApi
            Path: /reports/upload-url
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FloodReportsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${ReportPhotosBucket.Arn}/*"

  # Frontend Hosting
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

Outputs:
  ApiEndpoint:
    Description: "HTTP API endpoint URL"
    Value: !Sub "https://${BaarishApi}.execute-api.${AWS::Region}.amazonaws.com/"
  FrontendUrl:
    Description: "S3 Website URL for Frontend"
    Value: !GetAtt FrontendBucket.WebsiteURL
  FrontendBucketName:
    Description: "Frontend S3 Bucket Name"
    Value: !Ref FrontendBucket
