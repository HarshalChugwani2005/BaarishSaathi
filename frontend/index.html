<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaarishSaathi | Mumbai Monsoon Early-Warning</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>BaarishSaathi</h1>
        <p class="tagline">Know before the water rises.</p>
    </header>

    <main class="app-container">
        <div class="controls-panel">
            <div class="control-group">
                <select id="spot-select">
                    <option value="">-- Choose a location --</option>
                </select>
            </div>
            
            <div class="control-group simulate-toggle">
                <label class="switch">
                    <input type="checkbox" id="simulate-toggle">
                    <span class="slider round"></span>
                </label>
                <span class="sim-label">Simulate Heavy Rain</span>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
            
            <div class="map-legend">
                <span class="legend-item"><span class="dot green"></span> Low Risk</span>
                <span class="legend-item"><span class="dot orange"></span> Medium Risk</span>
                <span class="legend-item"><span class="dot red"></span> High Risk</span>
            </div>

            <div id="global-loading" class="overlay hidden">
                <div class="spinner"></div>
                <p id="loading-text">Tap a marker to see flood risk...</p>
                <button id="retry-btn" class="retry-btn hidden" onclick="location.reload()">Retry</button>
            </div>
        </div>

        <!-- Detail Card -->
        <div id="detail-card" class="detail-card hidden">
            <button class="close-btn" id="close-card">&times;</button>
            <div id="card-content">
                <!-- Content dynamically injected via app.js -->
            </div>
            
            <div id="subscribe-section" class="subscribe-section">
                <h4>Get alerts for this spot</h4>
                <form id="subscribe-form" class="subscribe-form">
                    <input type="email" id="subscribe-email" placeholder="Your email address" required>
                    <button type="submit">Subscribe</button>
                </form>
                <p id="subscribe-msg" class="subscribe-msg hidden"></p>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <p>Advisory only. Based on rainfall forecasts and commonly reported hotspots. Follow official BMC alerts.</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
